<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Maquetado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assets/logo.png" type="image/x-icon">
</head>
<body>
    <main class="container"> 

        <header> 
        <div class="logo" > 
            <img id="logoimg" src="./assets/logo.png" alt="character counter logo"> 
            <h2>Character Counter</h2>
        </div>
        <div class="sun"> 
            <img src="./assets/sun-regular-full.svg" alt="image sun">
        </div>
        </header>
        <section class="hero">
            <h1> Analyze your text<span class="salto">in real-time. </span> </h1>
            <textarea > </textarea>
        </section>
        <section class="controls"> 
            <div class="checkbox"> 
                <label  class="checkbox-item"> 
                    <input type="checkbox"> 
                    <span class="custom-checkbox"> </span>
                     Exclude Spaces
                </label>
                <label  class="checkbox-item"> 
                    <input type="checkbox"> 
                    <span class="custom-checkbox"> </span>
                     Set Character Limit 
                </label>
            </div>
            <p> Approx. reading time:&lt; 1 minute </p>
        </section>
        <section class="cards" >
            <div class="purple-card"> 
                <h2> 278</h2>
                <p> Total Characters</p>
            </div>
            <div class="orange-card"> 
                <h2> 39</h2>
                <p> Word Count</p>
            </div>
            <div class="red-card"> 
                <h2> 04</h2>
                <p> Sentence Count</p>
            </div>
        </section>
        <section class="letter">
            <h2> Letter Density</h2>
        </section>
        <section class="density"> 
            <div class="first">
                <p> E </p>
                <meter value="40" min="0" max="100"></meter>
                <p> 40 (16.06%)</p>
            </div>
             <div class="second">
                <p> I </p>
                <meter value="29" min="0" max="100"></meter>
                <p> 29 (11.65%)</p>
            </div>
             <div class="third">
                <p> T </p>
                <meter value="28" min="0" max="100"></meter>
                <p> 28 (11.24%)</p>
            </div>
             <div class="fourth">
                <p> O </p>
                <meter value="22" min="0" max="100"></meter>
                <p> 22 (UTF-884)</p>
            </div>
             <div class="fifth">
                <p> N </p>
                <meter value="21" min="0" max="100"></meter>
                <p> 21 (8.43%)</p>
            </div>
        </section>
        <section class="more"> 
            <button> See more <img src="./assets/icons8-angle-down-50.png" alt="angle down"></button>
        </section>
    </main>
</body>
</html>
