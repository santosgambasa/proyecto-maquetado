<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Maquetado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> 
        <input type="checkbox" id="theme-toggle">
    <div class="logo" > 
        <h2>Character Counter</h2>
        <img id="logoimg" src="./assets/logo.png" alt="character counter logo"> 
    </div>
    <div class="mode">
    <label for="theme-toggle" class="button">
      <img class="icon-moon" src="./assets/moon-regular-full.svg" alt="dark mode" >
      <img class="icon-sun" src="./assets/sun-regular-full.svg" alt="light mode" >
    </label>
   </div>
    </header>
    <section class="hero">
        <h1> Analyze your text in real-time</h1>
        <textarea placeholder="escribe"> </textarea>
    </section>
    <section class="controls"> 
        <div class="checkbox"> 
            <label> 
                <input type="checkbox"> Exclude Spaces
            </label>
            <label> 
                <input type="checkbox"> Set Character Limit 
            </label>
        </div>
        <p> Approx. reading time:&lt; 1 minute </p>
    </section>
    <section class="cards" >
        <div class="purple-card"> 
            <h2> 278</h2>
            <p> Total Characters</p>
        </div>
        <div class="orange-card"> 
            <h2> 39</h2>
            <p> Word Count</p>
        </div>
        <div class="red-card"> 
            <h2> 04</h2>
            <p> Sentence Count</p>
        </div>
    </section>
</body>
</html>
